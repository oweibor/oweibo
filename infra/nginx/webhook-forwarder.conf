# infra/nginx/webhook-forwarder.conf
#
# HMAC-verified webhook edge forwarder for inbound channel messages.
# Validates provider signatures before proxying to the oweibo ingestion API.
#
# Supported providers: WhatsApp Cloud API, iMessage (via Beeper), Google Chat
#
# Requires nginx with ngx_http_auth_request_module compiled in.
# The HMAC validator sidecar runs on 127.0.0.1:9090 (see webhook-validator service).
#
# Usage:
#   nginx -c /etc/nginx/nginx.conf -t  (test config)
#   nginx -s reload                    (hot reload)

upstream oweibo_api {
    server 127.0.0.1:3100;
    keepalive 32;
}

# HMAC validator sidecar — validates webhook signatures and returns 200|401
upstream webhook_validator {
    server 127.0.0.1:9090;
    keepalive 8;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=webhook_ip:10m rate=30r/m;
limit_req_zone $http_x_hub_signature_256 zone=webhook_sig:1m rate=100r/m;

# ── Logging ────────────────────────────────────────────────────────────────────
log_format webhook_log '$remote_addr [$time_iso8601] "$request" $status '
                       '$body_bytes_sent provider=$http_x_oweibo_provider '
                       'sig_valid=$upstream_cache_status';

# ── Main server block ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name webhooks.oweibo.internal;

    ssl_certificate     /etc/ssl/oweibo/cert.pem;
    ssl_certificate_key /etc/ssl/oweibo/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Remove server fingerprint
    server_tokens off;

    access_log /var/log/nginx/webhook-access.log webhook_log;
    error_log  /var/log/nginx/webhook-error.log warn;

    # ── WhatsApp Cloud API Webhook ─────────────────────────────────────────────
    location /webhooks/whatsapp {
        limit_req zone=webhook_ip burst=10 nodelay;

        # Step 1: Validate X-Hub-Signature-256 via HMAC validator sidecar
        auth_request /internal/validate-whatsapp;
        auth_request_set $auth_status $upstream_status;

        # Step 2: Forward validated payload to oweibo ingestion API
        proxy_pass         http://oweibo_api/api/v1/channels/whatsapp;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Oweibo-Provider "whatsapp";

        # Preserve raw body for signature re-verification downstream
        proxy_set_header   X-Raw-Signature $http_x_hub_signature_256;

        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;

        # Buffer settings — WhatsApp payloads are typically < 16KB
        proxy_buffering        on;
        proxy_buffer_size      4k;
        proxy_buffers          8 4k;
        proxy_max_temp_file_size 0;

        # Reject oversized payloads (max 1MB)
        client_max_body_size 1m;
    }

    # ── iMessage Webhook (Beeper bridge) ──────────────────────────────────────
    location /webhooks/imessage {
        limit_req zone=webhook_ip burst=10 nodelay;

        auth_request /internal/validate-imessage;

        proxy_pass         http://oweibo_api/api/v1/channels/imessage;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Oweibo-Provider "imessage";
        proxy_set_header   X-Raw-Signature $http_x_beeper_signature;

        client_max_body_size 1m;
        proxy_read_timeout   30s;
    }

    # ── Google Chat Webhook ────────────────────────────────────────────────────
    location /webhooks/google-chat {
        limit_req zone=webhook_ip burst=20 nodelay;

        # Google Chat uses bearer tokens rather than HMAC — validate via sidecar
        auth_request /internal/validate-google-chat;

        proxy_pass         http://oweibo_api/api/v1/channels/google-chat;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Oweibo-Provider "google-chat";

        client_max_body_size 1m;
        proxy_read_timeout   30s;
    }

    # ── Generic channel endpoint (extensible) ─────────────────────────────────
    location ~ ^/webhooks/([a-z0-9\-]+)$ {
        set $channel $1;
        limit_req zone=webhook_ip burst=10 nodelay;

        auth_request /internal/validate-generic;
        proxy_set_header X-Oweibo-Channel $channel;

        proxy_pass         http://oweibo_api/api/v1/channels/$channel;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Oweibo-Provider $channel;

        client_max_body_size 1m;
        proxy_read_timeout   30s;
    }

    # ── HMAC Validator internal sub-requests (not exposed externally) ──────────
    location = /internal/validate-whatsapp {
        internal;
        proxy_pass              http://webhook_validator/validate/whatsapp;
        proxy_pass_request_body on;
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header        Content-Type $content_type;
        proxy_read_timeout      5s;
    }

    location = /internal/validate-imessage {
        internal;
        proxy_pass              http://webhook_validator/validate/imessage;
        proxy_pass_request_body on;
        proxy_set_header        X-Beeper-Signature $http_x_beeper_signature;
        proxy_read_timeout      5s;
    }

    location = /internal/validate-google-chat {
        internal;
        proxy_pass              http://webhook_validator/validate/google-chat;
        proxy_pass_request_body on;
        proxy_set_header        Authorization $http_authorization;
        proxy_read_timeout      5s;
    }

    location = /internal/validate-generic {
        internal;
        proxy_pass              http://webhook_validator/validate/generic;
        proxy_pass_request_body on;
        proxy_set_header        X-Oweibo-Channel $channel;
        proxy_set_header        Authorization $http_authorization;
        proxy_read_timeout      5s;
    }

    # ── Health check (unauthenticated, for load balancer probes) ──────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok","component":"webhook-forwarder"}';
        add_header Content-Type application/json always;
    }

    # ── Block all other paths ──────────────────────────────────────────────────
    location / {
        return 404 '{"error":"not_found"}';
        add_header Content-Type application/json always;
    }
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name webhooks.oweibo.internal;
    return 301 https://$host$request_uri;
}
