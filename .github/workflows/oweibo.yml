# .github/workflows/oweibo.yml
# CI integration for remote skills — verifies skills.lock is up-to-date.
# Run on every PR and push to main.
name: oweibo CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  skills-lock-check:
    name: Remote Skills Lock Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check remote skills lock is current
        run: |
          pnpm --filter @oweibo/cli skills pull --lock-check
        env:
          OWEIBO_API_URL: ${{ secrets.OWEIBO_API_URL || 'http://localhost:3000' }}
        continue-on-error: true

  boundary-enforcement:
    name: Import Boundary Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency-cruiser
        run: npx dependency-cruiser --validate .dependency-cruiser.js packages/

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core-contracts
        run: pnpm --filter @oweibo/core-contracts build

      - name: TypeScript typecheck
        run: pnpm -r typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages required by tests
        run: |
          pnpm --filter @oweibo/core-contracts build
          pnpm --filter @oweibo/db exec prisma generate
          pnpm --filter @oweibo/db build
          pnpm --filter @oweibo/api-middleware build
          # kilo/pipeline tests run via tsx and import @oweibo/core-engine
          # at runtime through Node module resolution (no jest
          # moduleNameMapper for this package). `...` after the
          # filter selects core-engine AND its workspace deps
          # (observability, channel-contracts, prompt-registry) in
          # topological order so every dist/ exists before kilo's
          # tests run.
          pnpm --filter @oweibo/core-engine... build

      - name: Run tests
        run: pnpm -r test --if-present
        env:
          OWEIBO_DISABLE_PYTHON_SUBPROCESS: '1'
          QUARANTINE_BASE: ${{ runner.temp }}/kilo-quarantine

  role-literal-gate:
    name: Phase A.10 — CanonicalRole Literal Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for bare role string literals
        run: node scripts/check-role-literals.js

  promotion-gate:
    # D.9: blocks any PR that proposes a channel promotion unless all
    # cohort_promotion_rules criteria are satisfied.
    # Set PROMOTION_CHECK=skip to bypass in hotfix scenarios (requires approval).
    name: Phase D.9 — Promotion Gate
    runs-on: ubuntu-latest
    # Only run when promotion-related files are changed
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pg client
        run: npm install --no-save --legacy-peer-deps pg
      - name: Check promotion gate (skipped when no DATABASE_URL or PROMOTION_CHECK=skip)
        run: |
          if [ -z "$DATABASE_URL" ] || [ "$PROMOTION_CHECK" = "skip" ]; then
            echo "[promotion-gate] No DATABASE_URL or PROMOTION_CHECK=skip — skipping live gate check."
            exit 0
          fi
          # If PROMOTE_FROM / PROMOTE_TO are set, run gate check
          if [ -n "$PROMOTE_FROM" ] && [ -n "$PROMOTE_TO" ] && [ -n "$PROMOTE_SLOT" ] && [ -n "$PROMOTE_ARM" ]; then
            node scripts/check-promotion-gate.js \
              --from "$PROMOTE_FROM" --to "$PROMOTE_TO" \
              --slot "$PROMOTE_SLOT" --arm "$PROMOTE_ARM" \
              ${HUMAN_APPROVED:+--human-approved}
          else
            echo "[promotion-gate] No promotion variables set — gate check skipped for this PR."
          fi
        env:
          DATABASE_URL:    ${{ secrets.PLATFORM_DATABASE_URL }}
          PROMOTE_FROM:    ${{ vars.PROMOTE_FROM }}
          PROMOTE_TO:      ${{ vars.PROMOTE_TO }}
          PROMOTE_SLOT:    ${{ vars.PROMOTE_SLOT }}
          PROMOTE_ARM:     ${{ vars.PROMOTE_ARM }}
          HUMAN_APPROVED:  ${{ vars.HUMAN_APPROVED }}
          PROMOTION_CHECK: ${{ vars.PROMOTION_CHECK }}
