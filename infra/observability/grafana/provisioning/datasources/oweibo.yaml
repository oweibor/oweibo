# Grafana datasource provisioning — auto-configures Tempo, Loki, Prometheus.
# Grafana discovers this file on startup; no manual UI setup required.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift:   "1h"
        tags:
          - key:   oweibo.tenant.id
            value: oweibo_tenant_id
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key:   oweibo.tenant.id
            value: oweibo_tenant_id
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - name:          TraceID
          matcherRegex:  '"traceId":"(\w+)"'
          url:           '$${__value.raw}'
          datasourceUid: tempo
