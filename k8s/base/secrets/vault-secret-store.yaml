# k8s/base/secrets/vault-secret-store.yaml
# Auth method: Vault Kubernetes auth (service account token — NOT AppRole)
# Enable on Vault:  vault auth enable kubernetes
# Configure:        vault write auth/kubernetes/config kubernetes_host=https://$KUBE_API
# Role:             vault write auth/kubernetes/role/oweibo-pipeline \
#                     bound_service_account_names=oweibo-sa \
#                     bound_service_account_namespaces=oweibo \
#                     policies=oweibo-read ttl=1h
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: oweibo
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "oweibo-pipeline"
          serviceAccountRef:
            name: oweibo-sa
---
# ExternalSecret — pulls oweibo runtime credentials from Vault and
# materialises them as a Kubernetes Secret named oweibo-runtime-secrets.
# Consumed by the oweibo core-engine Deployment as envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oweibo-runtime-secrets
  namespace: oweibo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: oweibo-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: oweibo/infra/redis
        property: url
    - secretKey: QDRANT_URL
      remoteRef:
        key: oweibo/infra/qdrant
        property: url
    - secretKey: LLM_BASE_URL
      remoteRef:
        key: oweibo/infra/llm
        property: baseUrl
    - secretKey: LLM_MODEL
      remoteRef:
        key: oweibo/infra/llm
        property: model
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: oweibo/infra/jwt
        property: JWT_SIGNING_KEY
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: oweibo/infra/langfuse
        property: publicKey
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: oweibo/infra/langfuse
        property: secretKey
    - secretKey: LANGFUSE_HOST
      remoteRef:
        key: oweibo/infra/langfuse
        property: host
