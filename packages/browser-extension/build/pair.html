<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oweibo — Connect Browser</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      background: #0f1218; color: #eef1f8;
    }
    main {
      width: min(440px, 92vw); padding: 36px 32px;
      background: #171b25; border: 1px solid #2a3144; border-radius: 14px;
      box-shadow: 0 18px 48px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p  { margin: 0 0 20px; color: #9fb0d6; line-height: 1.5; font-size: 14px; }
    .row { display: flex; gap: 10px; margin-top: 8px; }
    button {
      flex: 1; font: inherit; font-weight: 600;
      padding: 11px 14px; border-radius: 8px; border: 0; cursor: pointer;
    }
    .connect { background: #3b82f6; color: #fff; }
    .connect:hover { background: #2f6ddb; }
    .connect:disabled { background: #2d3444; color: #6d7691; cursor: not-allowed; }
    .cancel  { background: #2d3444; color: #d9dfef; }
    .cancel:hover { background: #3a4256; }
    .status {
      margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .status.ok   { display: block; background: #103826; color: #7ee2a8; }
    .status.err  { display: block; background: #3a1620; color: #ff8b8b; }
    code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
           background: #0f1218; padding: 2px 6px; border-radius: 4px; color: #a6c8ff; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to Oweibo</h1>
    <p>
      Oweibo is requesting permission to control this browser using
      <code>chrome.debugger</code>. Click <strong>Connect</strong> to complete pairing.
      You can revoke access at any time from the extension popup.
    </p>
    <div class="row">
      <button class="cancel"  id="cancel">Cancel</button>
      <button class="connect" id="connect">Connect</button>
    </div>
    <div class="status" id="status"></div>
  </main>
  <script src="pair.js"></script>
</body>
</html>
