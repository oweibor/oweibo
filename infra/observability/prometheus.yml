# Prometheus — metrics backend.
# OTel collector pushes metrics via remote write (:9090/api/v1/write).
# --web.enable-remote-write-receiver is set in the docker-compose command.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: oweibo-dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # OTel collector internal telemetry (pipeline throughput, drop rates)
  - job_name: otelcol
    static_configs:
      - targets: ['otelcol:8888']
