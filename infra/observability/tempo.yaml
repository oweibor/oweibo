# Grafana Tempo — distributed tracing backend.
# Accepts OTLP/gRPC from the OTel collector.
# Storage: local filesystem (swap for object storage in production).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h  # 30 days

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

querier:
  frontend_worker:
    frontend_address: tempo:9095

query_frontend:
  search:
    max_duration: 0

# Tag search indexes for oweibo.* attributes
search:
  enabled: true
  tags_search_max_coros: 5000

overrides:
  metrics_generator_processors: [service-graphs, span-metrics]
